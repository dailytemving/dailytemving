<style>
  :root{
    --ink:#191919;
    --sub:#5E5A53;
    --muted:#8D877D;
    --line:#E8E4DB;
    --line2:#F0EDE6;
    --cream:#FBF8F2;
    --green:#1E4631;
    --green-soft:#EDF2EC;
    --sale:#B4341F;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:#F3F0E9;
    color:var(--ink);
    font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    font-size:16px;
    line-height:1.65;
    letter-spacing:-.012em;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-variant-numeric:tabular-nums;letter-spacing:0}
  img{max-width:100%}
  a{color:inherit}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  .page{max-width:600px;margin:0 auto;background:#fff;padding-bottom:16px}
  @media (min-width:680px){
    .page{margin:28px auto 44px;padding-bottom:8px;border-radius:16px;overflow:hidden}
  }

  /* ── 상단 ── */
  .head{padding:20px 20px 16px}
  .head__meta{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--muted)}
  .head__meta b{font-weight:600;color:var(--sub)}
  .logo{margin:10px 0 0;font-size:26px;font-weight:800;letter-spacing:-.045em;line-height:1.2}
  .logo em{font-style:normal;color:var(--green)}
  .lede{margin:8px 0 0;font-size:14.5px;line-height:1.55;color:var(--sub)}

  /* ── 메인 탭 (3개) ── */
  .tabs{
    position:sticky;top:0;z-index:30;display:flex;
    background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  }
  .tab{
    appearance:none;border:0;background:none;font:inherit;cursor:pointer;
    flex:1 1 0;padding:15px 6px 13px;font-size:15px;line-height:1.2;font-weight:500;
    color:var(--muted);white-space:nowrap;position:relative;letter-spacing:-.02em;
  }
  .tab + .tab{border-left:1px solid var(--line2)}
  .tab[aria-selected="true"]{color:var(--ink);font-weight:700}
  .tab[aria-selected="true"]::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;background:var(--ink)}
  .tab:focus-visible{outline:2px solid var(--green);outline-offset:-3px;border-radius:6px}

  /* ── 패널 ── */
  .panel{padding:0 20px 30px}
  .panel__lead{margin:0;padding:15px 0 0;font-size:14px;line-height:1.55;color:var(--sub)}

  /* ── 금액대·상황 필터 칩 ── */
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0 0}
  .chip{
    appearance:none;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:5px;
    padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--sub);
    font-size:14px;line-height:1.2;font-weight:500;letter-spacing:-.02em;
  }
  .chip__n{font-size:12px;font-weight:600;color:var(--muted)}
  .chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
  .chip[aria-pressed="true"] .chip__n{color:rgba(255,255,255,.72)}
  .chip:focus-visible{outline:2px solid var(--green);outline-offset:2px}

  /* ── 공정위 고지 ── */
  .notice{
    display:flex;align-items:flex-start;gap:7px;margin:0;padding:12px 0 0;
    font-size:12.5px;line-height:1.5;color:var(--muted);letter-spacing:-.005em;
  }
  .notice::before{
    content:"";flex:0 0 auto;width:5px;height:5px;margin-top:7px;border-radius:50%;
    background:var(--green);opacity:.5;
  }
  .notice > span{min-width:0;word-break:keep-all}
  .notice > span > span{white-space:nowrap}
  /* 레시피 탭: 재료 링크 바로 위 고지 */
  .notice--in{margin:12px 0 0;padding:0;border:0;background:none}

  /* ── 상품 리스트 ── */
  .deal-list__head{padding:19px 0 2px}
  .deal-list__title{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.02em}
  .deal-list__title em{font-style:normal;margin-left:5px;font-size:13px;font-weight:600;color:var(--green)}
  .deal-list__sub{margin:4px 0 0;font-size:13.5px;line-height:1.5;color:var(--sub);word-break:keep-all}

  .deal{display:flex;gap:14px;padding:18px 0;border-top:1px solid var(--line2);text-decoration:none}
  .deal:first-of-type{border-top:0}
  .deal__img{flex:0 0 auto;width:92px;height:92px;border:1px solid var(--line2);border-radius:10px;background:#fff;object-fit:contain;padding:5px}
  .deal__body{flex:1;min-width:0;padding-top:2px}
  .deal__name{display:block;font-size:15px;font-weight:600;line-height:1.45;letter-spacing:-.02em;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .deal__hook{display:block;margin-top:4px;font-size:14px;line-height:1.5;color:var(--sub);word-break:keep-all}
  .deal__note{display:block;margin-top:5px;font-size:13px;line-height:1.55;color:var(--muted);word-break:keep-all}
  .deal__meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:9px}
  .price{font-size:17px;font-weight:700;color:var(--ink)}
  .off{font-size:13px;font-weight:700;color:var(--sale)}
  .badge{font-size:12px;font-weight:600;color:var(--green);background:var(--green-soft);border-radius:5px;padding:2px 7px;line-height:1.5}
  .reviews{font-size:13px;color:var(--muted)}

  /* ── 안내·빈 화면 ── */
  .empty{margin:18px 0 0;padding:28px 20px 26px;border:1px dashed #D9D3C6;border-radius:14px;background:var(--cream);text-align:center}
  .empty--place{margin-top:20px;padding:34px 20px 32px}
  .empty__title{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.03em;line-height:1.45;word-break:keep-all}
  .empty__body{margin:9px 0 0;font-size:14.5px;line-height:1.6;color:var(--sub);word-break:keep-all}
  .empty__note{margin:16px 0 0;padding-top:15px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.55;color:var(--muted);word-break:keep-all}

  /* ── 아이랑 갈 곳: 장소 카드 ── */
  .places{display:block;margin:4px 0 0}
  .place{margin:0;padding:24px 0 26px;border-top:1px solid var(--line2)}
  .place:first-child{border-top:1px solid var(--line);padding-top:20px}
  .place__chip{display:inline-block;font-size:12px;font-weight:600;line-height:1.7;color:var(--green);background:var(--green-soft);border-radius:5px;padding:2px 8px;letter-spacing:-.01em}
  .place__name{margin:9px 0 0;font-size:18px;font-weight:700;letter-spacing:-.035em;line-height:1.4;word-break:keep-all}
  .place__addr{margin:6px 0 0;font-size:13px;line-height:1.6;color:var(--muted);word-break:keep-all}
  .place__facts{margin:13px 0 0;padding:12px 0 0;border-top:1px solid var(--line2);display:grid;gap:6px}
  .place__facts > div{display:flex;gap:9px}
  .place__facts dt{flex:0 0 auto;min-width:31px;font-size:13px;line-height:1.6;color:var(--muted);font-weight:500}
  .place__facts dd{margin:0;font-size:13.5px;line-height:1.6;color:var(--ink);word-break:keep-all}
  .place__desc{margin:13px 0 0;font-size:14.5px;line-height:1.68;color:var(--sub);word-break:keep-all}
  .place__tips{list-style:none;margin:11px 0 0;padding:0;display:grid;gap:6px}
  .place__tips li{position:relative;padding-left:12px;font-size:13.5px;line-height:1.6;color:var(--sub);word-break:keep-all}
  .place__tips li::before{content:"";position:absolute;left:0;top:9px;width:4px;height:4px;border-radius:50%;background:#C9C2B4}
  .place__map{display:inline-flex;align-items:center;gap:4px;margin:15px 0 0;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13.5px;font-weight:600;color:var(--green);text-decoration:none;letter-spacing:-.02em}
  .place__map:hover{border-color:var(--green)}
  .place__map:focus-visible{outline:2px solid var(--green);outline-offset:2px}

  /* ── 탭 숫자 ── */
  .tab__n{margin-left:5px;font-size:12px;font-weight:600;color:var(--muted)}
  .tab[aria-selected="true"] .tab__n{color:var(--green)}

  /* ── 아이랑 갈 곳: 갈 때 챙길 템 ── */
  .carry{margin:30px 0 0;padding:17px 18px 18px;border:1px solid var(--line);border-radius:14px;background:var(--cream)}
  .carry__title{margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.025em}
  .carry__sub{margin:5px 0 0;font-size:13px;line-height:1.5;color:var(--sub)}
  .carry__list{list-style:none;margin:13px 0 0;padding:0;display:grid;gap:8px}
  .carry__item{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;text-decoration:none}
  .carry__img{flex:0 0 auto;width:42px;height:42px;border:1px solid var(--line2);border-radius:7px;background:#fff;object-fit:contain;padding:3px}
  .carry__body{min-width:0}
  .carry__name{display:block;font-size:13.5px;line-height:1.4;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .carry__price{display:flex;align-items:baseline;gap:6px;margin-top:2px}
  .carry__price b{font-size:13.5px;font-weight:700}
  .carry__price span{font-size:12.5px;color:var(--muted)}
  .carry__note{margin:11px 0 0;font-size:12px;line-height:1.5;color:var(--muted);word-break:keep-all}

  /* ── 집밥 레시피: 냉장고 재료 필터 ── */
  .ing-filter{margin:13px 0 0;padding:11px 13px 12px;border:1px solid var(--line);border-radius:12px;background:var(--cream)}
  .ing-filter__label{margin:0;font-size:12.5px;font-weight:700;letter-spacing:-.02em;color:var(--green)}
  .ing-filter .chips{margin:9px 0 0;gap:6px}
  .ing-filter .chip{padding:7px 10px;font-size:13px}
  .ing-filter__hint{margin:9px 0 0;font-size:12.5px;line-height:1.5;color:var(--sub);word-break:keep-all}
  .ing-filter__hint b{color:var(--ink);font-weight:700}
  .empty__reset{appearance:none;font:inherit;margin-top:14px;padding:10px 16px;border:1px solid var(--green);border-radius:999px;background:#fff;color:var(--green);font-size:14px;font-weight:600;cursor:pointer}

  /* ── 집밥 레시피: 카드 ── */
  .recipes{list-style:none;margin:13px 0 0;padding:0;display:grid;gap:24px}
  .recipe{display:block;width:100%;text-align:left;padding:0;border:0;background:none;font:inherit;cursor:pointer;color:inherit}
  .recipe__img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:var(--cream)}
  .recipe__title{display:block;margin:14px 0 10px;font-size:17px;font-weight:700;letter-spacing:-.025em;line-height:1.42}
  .recipe__dek{display:block;margin:0 0 12px;font-size:14px;line-height:1.6;color:var(--sub);word-break:keep-all}
  .recipe__meta{display:block;margin:0;font-size:13px;color:var(--muted)}
  .recipe:focus-visible{outline:2px solid var(--green);outline-offset:4px;border-radius:6px}

  /* ── 집밥 레시피: 재료·주방템 링크 그리드 ── */
  .cheat-sec{margin-top:34px;padding-top:24px;border-top:1px solid var(--line)}
  .cheat-sec__title{margin:0;font-size:17px;font-weight:700;letter-spacing:-.03em}
  .cheat-sec__sub{margin:5px 0 0;font-size:13.5px;line-height:1.55;color:var(--sub);word-break:keep-all}
  .cheat-grid{list-style:none;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0 0;padding:0}
  .cheat{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;
    font-size:14px;line-height:1.3;font-weight:500;letter-spacing:-.02em;color:var(--ink);text-decoration:none;
  }
  .cheat span{flex:0 0 auto;color:var(--green);font-size:12px}
  .cheat:active{background:var(--cream)}
  .cheat-grid li:last-child:nth-child(odd){grid-column:1 / -1}
  .cheat-note{margin:10px 0 0;font-size:12.5px;line-height:1.5;color:var(--muted);word-break:keep-all}

  .tip{margin:26px 0 0;padding:16px 18px;border-radius:12px;background:var(--cream);border:1px solid var(--line2)}
  .tip__title{margin:0;font-size:15px;font-weight:700}
  .tip__body{margin:6px 0 0;font-size:14px;line-height:1.6;color:var(--sub);word-break:keep-all}

  /* ── 레시피 상세 시트 ── */
  .sheet{position:fixed;inset:0;z-index:60}
  .sheet[aria-hidden="true"]{pointer-events:none}
  .sheet__scrim{position:absolute;inset:0;background:rgba(20,20,20,.38);opacity:0;transition:opacity .26s ease}
  .sheet[aria-hidden="false"] .sheet__scrim{opacity:1}
  .sheet[aria-hidden="true"] .sheet__scrim{visibility:hidden;transition:opacity .26s ease,visibility 0s .26s}
  .sheet__panel{
    position:absolute;left:50%;bottom:0;transform:translateX(-50%) translateY(100%);
    width:100%;max-width:600px;max-height:92vh;max-height:92dvh;
    background:#fff;border-radius:16px 16px 0 0;
    display:flex;flex-direction:column;
    transition:transform .3s cubic-bezier(.22,.8,.3,1);
  }
  .sheet[aria-hidden="false"] .sheet__panel{transform:translateX(-50%) translateY(0)}
  .sheet[aria-hidden="true"] .sheet__panel{visibility:hidden;transition:transform .3s cubic-bezier(.22,.8,.3,1),visibility 0s .3s}
  .sheet__scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:36px}
  .sheet__bar{
    position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;
    padding:12px 20px;background:rgba(255,255,255,.97);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  }
  .sheet__bar span{font-size:14px;color:var(--muted)}
  .sheet__close{appearance:none;border:0;background:none;font:inherit;cursor:pointer;padding:4px 2px;font-size:15px;color:var(--ink);font-weight:600}
  .sheet__close:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:4px}

  .sheet__cover{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--cream)}
  .sheet__body{padding:22px 20px 0}
  .sheet__kicker{margin:0;font-size:14px;color:var(--muted)}
  .sheet__title{margin:12px 0 0;font-size:23px;font-weight:800;line-height:1.35;letter-spacing:-.035em}
  .sheet__dek{margin:12px 0 0;font-size:15px;line-height:1.65;color:var(--sub);word-break:keep-all}

  .facts{list-style:none;display:flex;margin:22px 0 0;padding:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .facts li{flex:1;padding:12px 0 11px;text-align:center;border-left:1px solid var(--line2)}
  .facts li:first-child{border-left:0}
  .facts span{display:block;font-size:13px;color:var(--muted)}
  .facts b{display:block;margin-top:3px;font-size:15px;font-weight:600}

  .block{margin-top:26px}
  .block__head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .block__title{margin:0;font-size:16px;font-weight:700;letter-spacing:-.02em}
  .block__count{margin:0;font-size:14px;color:var(--sub)}
  .block__count b{color:var(--green);font-weight:700}

  .ing-list{list-style:none;margin:10px 0 0;padding:0}
  .ing{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line2);padding:1px 0}
  .ing:first-child{border-top:1px solid var(--line2)}
  .ing__label{position:relative;flex:1;min-width:0;display:flex;align-items:flex-start;gap:12px;padding:13px 0;cursor:pointer}
  .ing__label input{position:absolute;width:1px;height:1px;opacity:0;margin:0}
  .ing__box{flex:0 0 auto;width:18px;height:18px;margin-top:2px;border:1.5px solid #CFC9BE;border-radius:4px;background:#fff;position:relative;transition:background .15s ease,border-color .15s ease}
  .ing__label input:checked ~ .ing__box{background:var(--green);border-color:var(--green)}
  .ing__label input:checked ~ .ing__box::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:2px solid #fff;border-top:0;border-left:0;transform:rotate(40deg)}
  .ing__name{font-size:15px;line-height:1.5;color:var(--ink);transition:color .15s ease;word-break:keep-all}
  .ing__label input:checked ~ .ing__name{color:#B4AEA3;text-decoration:line-through}
  .ing__label input:focus-visible ~ .ing__box{outline:2px solid var(--green);outline-offset:3px}
  .ing__buy{flex:0 0 auto;font-size:13px;color:var(--green);text-decoration:none;padding:4px 0;border-bottom:1px solid rgba(30,70,49,.3);white-space:nowrap}

  .steps{list-style:none;margin:10px 0 0;padding:0}
  .steps li{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line2)}
  .steps li:last-child{border-bottom:0;padding-bottom:2px}
  .steps__n{flex:0 0 auto;min-width:20px;padding-top:1px;font-size:14px;font-weight:700;color:var(--green)}
  .steps p{margin:0;font-size:15px;line-height:1.7;color:var(--ink);word-break:keep-all}

  .note{margin:24px 0 0;padding:16px 18px;border-radius:12px;background:var(--cream);border:1px solid var(--line2)}
  .note__label{margin:0;font-size:13px;font-weight:700;color:var(--green)}
  .note p{margin:6px 0 0;font-size:14px;line-height:1.7;color:var(--sub);word-break:keep-all}

  .saver{margin-top:22px;padding:16px 18px;border:1px solid var(--line);border-radius:12px}
  .saver__label{display:block;font-size:13px;color:var(--muted)}
  .saver__name{display:block;margin:5px 0 0;font-size:15px;font-weight:700}
  .saver__desc{display:block;margin:4px 0 0;font-size:14px;line-height:1.6;color:var(--sub);word-break:keep-all}
  .saver__link{display:inline-block;margin-top:10px;font-size:14px;font-weight:600;color:var(--green);text-decoration:none;border-bottom:1px solid rgba(30,70,49,.35)}

  .picks{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;padding:0}
  .pick{display:inline-flex;align-items:center;gap:4px;padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:14px;color:var(--ink);text-decoration:none}
  .pick span{color:var(--green)}

/* ───────────────────── GA4 이벤트 ───────────────────── */
function trackTab(name, key, level){
  if (typeof gtag === 'function'){
    gtag('event', 'tab_view', { tab_name: name, tab_key: key, tab_level: level || 'main' });
  }
}

function trackCoupang(a){
  if (typeof gtag !== 'function') return;
  const params = {
    item_name: a.dataset.item || '',
    category: a.dataset.cat || '',
    link_url: a.href,
    transport_type: 'beacon'
  };
  if (a.dataset.price) params.price = Number(a.dataset.price);
  gtag('event', 'coupang_click', params);
}

document.addEventListener('click', function (e){
  const a = e.target.closest('a[href*="link.coupang.com"]');
  if (a) trackCoupang(a);
}, false);

const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const won = (n) => n.toLocaleString('ko-KR') + '원';
const count = (n) => n >= 10000 ? (Math.floor(n/1000)/10).toString().replace(/\.0$/,'') + '만' : n.toLocaleString('ko-KR');

/* ───────────────────── 탭 1: 상품 리스트 ───────────────────── */
function itemsFor(key){
  if (key === 'all') return PRODUCTS.kids;
  return PRODUCTS.kids.filter(function (p){
    return (p.tags || []).indexOf(key) >= 0;
  });
}

function filterOf(key){
  return FILTERS.filter(function (f){ return f.key === key; })[0] || FILTERS[0];
}

function dealHTML(p, idx){
  const off = p.was ? Math.round((1 - p.price / p.was) * 100) : 0;
  return '' +
  '<a class="deal" href="' + esc(p.url) + '" target="_blank" rel="nofollow sponsored noopener" ' +
     'data-item="' + esc(p.name) + '" data-cat="' + esc(filterOf(currentFilter).label) + '" data-price="' + p.price + '">' +
    '<img class="deal__img" src="' + esc(p.img) + '" alt="' + esc(p.name) + '" loading="' + (idx === 0 ? 'eager' : 'lazy') + '" decoding="async">' +
    '<span class="deal__body">' +
      '<span class="deal__name">' + esc(p.name) + '</span>' +
      '<span class="deal__hook">' + esc(p.hook) + '</span>' +
      (p.note ? '<span class="deal__note">' + esc(p.note) + '</span>' : '') +
      '<span class="deal__meta">' +
        (off ? '<span class="off num">' + off + '%</span>' : '') +
        '<span class="price num">' + won(p.price) + '</span>' +
        '<span class="badge">' + (p.rocket ? '로켓배송' : '무료배송') + '</span>' +
        '<span class="reviews num">후기 ' + count(p.reviews) + '</span>' +
      '</span>' +
    '</span>' +
  '</a>';
}

function dealListHTML(items){
  if (!items.length){
    return '<p class="deal-list__sub">이 칸은 다음 확인 때 채울게요.</p>';
  }
  return items.map(function (p, i){ return dealHTML(p, i); }).join('');
}

function dealHeadHTML(f, items){
  return '' +
    '<h3 class="deal-list__title">' + esc(f.label) + '<em class="num">' + items.length + '</em></h3>' +
    '<p class="deal-list__sub">' + esc(f.sub) + '</p>';
}

/* ── 공정위 고지 ── */
function noticeHTML(mod){
  return '<p class="notice' + (mod ? ' ' + mod : '') + '">' +
    '<span><span>쿠팡 파트너스 활동의 일환으로,</span> <span>이에 따른 일정액의 수수료를 제공받습니다.</span></span>' +
  '</p>';
}

function giftsPanelHTML(){
  const f = filterOf(currentFilter);
  const items = itemsFor(currentFilter);
  const chips = FILTERS.map(function (x){
    return '<button class="chip" type="button" data-filter="' + x.key + '" aria-pressed="' + (x.key === currentFilter) + '">' +
      esc(x.label) + '<span class="chip__n num">' + itemsFor(x.key).length + '</span></button>';
  }).join('');
  return '' +
    '<h2 class="sr-only">' + esc(TABS.gifts.label) + '</h2>' +
    '<p class="panel__lead">7세 딸 키우며 고른 ' + PRODUCTS.kids.length + '개. 금액대 눌러서 바로 보세요.</p>' +
    '<div class="chips" role="group" aria-label="금액대·상황 필터">' + chips + '</div>' +
    noticeHTML() +
    '<div class="deal-list__head" id="dealHead">' + dealHeadHTML(f, items) + '</div>' +
    '<div id="dealList">' + dealListHTML(items) + '</div>';
}

const INGREDIENTS = ['계란','두부','새우','양배추','참치','순두부','설렁탕 육수','닭고기','현미밥','버터','간장','두유면','사과','당근','키위','딸기','요거트'];
let picked = [];

function recipesFor(list){
  if (!list.length) return RECIPES;
  return RECIPES.filter(function (r){
    return list.every(function (t){ return r.tags.indexOf(t) >= 0; });
  });
}

function ingChipsHTML(){
  return '<button class="chip" type="button" data-ing-chip="__all" aria-pressed="' + (!picked.length) + '">전체</button>' +
    INGREDIENTS.map(function (t){
      return '<button class="chip" type="button" data-ing-chip="' + esc(t) + '" aria-pressed="' + (picked.indexOf(t) >= 0) + '">' + esc(t) + '</button>';
    }).join('');
}

function ingHintHTML(list){
  if (!picked.length) return '재료를 누르면 그 재료가 들어간 레시피만 남습니다. 여러 개를 누르면 <b>모두</b> 들어간 레시피예요.';
  if (!list.length) return '고른 재료 <b>' + esc(picked.join(' · ')) + '</b> 조합은 지금 레시피가 없어요.';
  return '고른 재료 <b>' + esc(picked.join(' · ')) + '</b> 기준, 레시피 <b class="num">' + list.length + '편</b>';
}

$$('.tab').forEach(function (btn){
  btn.addEventListener('click', function (){
    const key = btn.dataset.tab;
    if (!TABS[key] || key === currentTab) return;
    currentTab = key;
    $$('.tab').forEach(function (b){ b.setAttribute('aria-selected', String(b === btn)); });
    renderPanel();
    trackTab(TABS[key].label, key, 'main');
  });
});

/* ───────────────────── 금액대·상황 필터 ───────────────────── */
function refreshDeals(){
  const f = filterOf(currentFilter);
  const items = itemsFor(currentFilter);
  const head = $('#dealHead');
  if (head) head.innerHTML = dealHeadHTML(f, items);
  const list = $('#dealList');
  if (list) list.innerHTML = dealListHTML(items);
  $$('[data-filter]').forEach(function (b){
    b.setAttribute('aria-pressed', String(b.dataset.filter === currentFilter));
  });
}

document.addEventListener('click', function (e){
  const chip = e.target.closest('[data-filter]');
  if (!chip || !chip.classList.contains('chip')) return;
  const key = chip.dataset.filter;
  const known = FILTERS.some(function (x){ return x.key === key; });
  if (!known || key === currentFilter) return;
  currentFilter = key;
  refreshDeals();
  trackTab(filterOf(key).label, 'gifts_' + key, 'filter');
}, false);

/* ───────────────────── 집밥 레시피: 냉장고 재료 필터 ───────────────────── */
function trackRecipeFilter(){
  if (typeof gtag !== 'function') return;
  gtag('event', 'recipe_filter', {
    ingredients: picked.length ? picked.join(',') : 'all',
    picked_count: picked.length,
    recipe_count: recipesFor(picked).length
  });
}

function refreshRecipeFilter(){
  const list = recipesFor(picked);
  const box = $('#recipeList');
  if (box) box.innerHTML = recipeListHTML(list);
  $$('[data-ing-chip]').forEach(function (b){
    const on = b.dataset.ingChip === '__all' ? !picked.length : picked.indexOf(b.dataset.ingChip) >= 0;
    b.setAttribute('aria-pressed', String(on));
  });
  const hint = $('#ingHint');
  if (hint) hint.innerHTML = ingHintHTML(list);
}

document.addEventListener('click', function (e){
  if (e.target.closest('[data-reset]')){
    picked = [];
    refreshRecipeFilter();
    trackRecipeFilter();
    return;
  }
  const btn = e.target.closest('[data-ing-chip]');
  if (!btn) return;
  const key = btn.dataset.ingChip;
  if (key === '__all'){
    picked = [];
  } else if (picked.indexOf(key) >= 0){
    picked = picked.filter(function (x){ return x !== key; });
  } else {
    picked = picked.concat(key);
  }
  refreshRecipeFilter();
  trackRecipeFilter();
}, false);

/* 재료 체크는 이 폰에만 저장 */
const STORE_KEY = 'dtb-recipe-check-v3';
function readStore(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e){ return {}; }
}
function writeStore(v){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(v)); } catch (e){ /* 사생활 보호 모드 */ }
}

function updateIngDone(){
  const boxes = $$('input[data-ingbox]', sheetBody);
  const done = boxes.filter(function (b){ return b.checked; }).length;
  const el = $('#ingDone');
  if (el) el.textContent = done;
}

function openSheet(id){
  const r = RECIPES.find(function (x){ return x.id === id; });
  if (!r) return;

  lastFocus = document.activeElement;
  sheetBody.innerHTML = sheetHTML(r);
  $('#sheetBarLabel').textContent = '레시피 ' + r.no;

  const store = readStore();
  $$('input[data-ingbox]', sheetBody).forEach(function (box){
    if (store[box.dataset.ingbox]) box.checked = true;
    box.addEventListener('change', function (){
      const s = readStore();
      if (box.checked) s[box.dataset.ingbox] = 1; else delete s[box.dataset.ingbox];
      writeStore(s);
      updateIngDone();
    });
  });
  updateIngDone();

  sheet.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  $('#sheetScroll').scrollTop = 0;
  const closeBtn = $('.sheet__close', sheet);
  if (closeBtn) closeBtn.focus({ preventScroll: true });
  trackTab(TABS.recipe.label, 'recipe_' + r.id, 'detail');
}

function closeSheet(){
  sheet.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
}

document.addEventListener('click', function (e){
  const opener = e.target.closest('[data-open]');
  if (opener){ openSheet(opener.dataset.open); return; }
  if (e.target.closest('[data-close]')){ closeSheet(); }
});

document.addEventListener('keydown', function (e){
  if (e.key === 'Escape' && sheet.getAttribute('aria-hidden') === 'false') closeSheet();
});

/* 헤더 카운터는 실제 데이터 수로 맞춥니다 */
$('#totalCount').textContent = PRODUCTS.kids.length;
$('#placeCount').textContent = PLACES.length;
$('#recipeCount').textContent = RECIPES.length;
$('#recipeHeadCount').textContent = RECIPES.length;

/* 첫 화면: 육아템·선물 */
renderPanel();
trackTab(TABS.gifts.label, 'gifts', 'main');
</script>
</body>
</html>
