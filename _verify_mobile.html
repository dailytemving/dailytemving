<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>mobile verify (임시)</title>
<style>
  body{margin:0;background:#E9E5DC;font-family:'Apple SD Gothic Neo',system-ui,sans-serif}
  .wrap{display:flex;gap:16px;padding:16px;width:1250px}
  .f{width:390px}
  .f span{display:block;margin:0 0 8px;font-size:13px;color:#4A463F;font-weight:700}
  iframe{display:block;width:390px;height:844px;border:0;background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(0,0,0,.12)}
</style>
</head>
<body>
<div class="wrap">
  <div class="f"><span>1. 첫 화면 · 10분 레시피 (기본 탭)</span><iframe id="a" src="./index.html" title="a" scrolling="no"></iframe></div>
  <div class="f"><span>2. 냉장고 재료 '계란 + 양배추' 선택</span><iframe id="b" src="./index.html" title="b" scrolling="no"></iframe></div>
  <div class="f"><span>3. 추천템 모음 탭 · 카테고리 필터</span><iframe id="c" src="./index.html" title="c" scrolling="no"></iframe></div>
</div>
<script>
window.addEventListener('load', function (){
  setTimeout(function (){
    try {
      var b = document.getElementById('b').contentDocument;
      b.querySelector('[data-ing="계란"]').click();
      b.querySelector('[data-ing="양배추"]').click();
    } catch (e){ document.title = 'B ERR ' + e.message; }
    try {
      var c = document.getElementById('c').contentDocument;
      c.querySelector('.tab[data-tab="deals"]').click();
      c.querySelector('.chip[data-cat="beauty"]').click();
    } catch (e){ document.title = 'C ERR ' + e.message; }
  }, 1500);
});
</script>
</body>
</html>
