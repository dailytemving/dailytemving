<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>mobile verify (임시)</title>
<style>
  body{margin:0;background:#E9E5DC;font-family:'Apple SD Gothic Neo',system-ui,sans-serif}
  .wrap{display:flex;gap:16px;padding:16px;width:1633px}
  .f{width:390px}
  .f span{display:block;margin:0 0 8px;font-size:13px;color:#4A463F;font-weight:700;white-space:nowrap}
  iframe{display:block;width:390px;height:844px;border:0;background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(0,0,0,.12)}
</style>
</head>
<body>
<div class="wrap">
  <div class="f"><span>1. 첫 화면 · 10분 레시피 (기본 탭)</span><iframe id="a" src="./index.html?v=6" title="a" scrolling="no"></iframe></div>
  <div class="f"><span>2. 재료 '계란 + 양배추' 필터</span><iframe id="b" src="./index.html?v=6" title="b" scrolling="no"></iframe></div>
  <div class="f"><span>3. 추천템 모음 · 카테고리 필터</span><iframe id="c" src="./index.html?v=6" title="c" scrolling="no"></iframe></div>
  <div class="f"><span>4. 레시피 카드 줄 간격</span><iframe id="d" src="./index.html?v=6" title="d"></iframe></div>
</div>
<div id="st" style="position:fixed;left:8px;bottom:6px;font:11px/1.3 monospace;color:#777"></div>
<script>
var log=[];
function pick(doc,sel){ return doc?doc.querySelector(sel):null; }
function apply(){
  try{
    var d=document.getElementById('d').contentWindow;
    if(d && d.scrollY < 300) d.scrollTo(0,620);
  }catch(e){ log.push('d:'+e.message); }
  try{
    var b=document.getElementById('b').contentDocument;
    var e1=pick(b,'[data-ing="계란"]'), e2=pick(b,'[data-ing="양배추"]');
    if(e1&&e2){
      if(e1.getAttribute('aria-pressed')!=='true') e1.click();
      if(e2.getAttribute('aria-pressed')!=='true') e2.click();
      log.push('b:ok');
    }
  }catch(e){ log.push('b:'+e.message); }
  try{
    var c=document.getElementById('c').contentDocument;
    var tab=pick(c,'.tab[data-tab="deals"]');
    if(tab){
      if(tab.getAttribute('aria-selected')!=='true') tab.click();
      var chip=pick(c,'.chip[data-cat="beauty"]');
      if(chip&&chip.getAttribute('aria-pressed')!=='true') chip.click();
      log.push('c:ok');
    }
  }catch(e){ log.push('c:'+e.message); }
  document.getElementById('st').textContent=log.join(' | ');
}
var n=0,t=setInterval(function(){ n++; apply(); if(n>=8) clearInterval(t); },700);
</script>
</body>
</html>
