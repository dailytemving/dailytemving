<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>모바일 390px 확인용</title>
<style>
  html,body{margin:0;background:#E6E2D9;font-family:sans-serif}
  .frame{width:390px;margin:20px auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.18)}
  iframe{display:block;width:390px;height:844px;border:0;background:#fff}
</style>
</head>
<body>
<div class="frame"><iframe id="f" src="./index.html" title="데일리템빙 모바일 확인"></iframe></div>
<script>
  document.getElementById('f').addEventListener('load', function () {
    var d = this.contentDocument;
    var b = d && d.querySelector('.tab[data-tab="places"]');
    if (b) b.click();
  });
</script>
</body>
</html>
